<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貼文產生器</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #dfe3ea;
    --primary: #4f6df5;
    --primary-text: #ffffff;
    --ok: #16a34a;
    --err: #dc2626;
    --shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --card: #1b1e27;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --border: #2d3240;
      --primary: #6f87ff;
      --primary-text: #0b0d14;
      --ok: #4ade80;
      --err: #f87171;
      --shadow: 0 2px 10px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .full { grid-column: 1 / -1; }
  input[type="text"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    outline: none;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: 500; margin: 0; cursor: pointer; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  button {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 600; }
  button.small { padding: 6px 12px; font-size: 13px; }
  #msg { font-size: 14px; min-height: 20px; }
  #msg.err { color: var(--err); }
  #msg.ok { color: var(--ok); }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .result-title { font-weight: 700; }
  .count { font-size: 13px; color: var(--muted); }
  .count.over { color: var(--err); font-weight: 600; }
  .result textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ 貼文產生器</h1>
  <p class="sub">輸入主題與關鍵字，一鍵產生多則可直接使用的社群貼文。</p>

  <div class="card">
    <div class="grid">
      <div class="full">
        <label for="topic">貼文主題 *</label>
        <input type="text" id="topic" placeholder="例如：新開幕的手沖咖啡店、週末市集活動、新品上市">
      </div>
      <div class="full">
        <label for="keywords">關鍵字（用逗號、頓號或空白分隔，可留空）</label>
        <input type="text" id="keywords" placeholder="例如：手工烘焙, 限量, 開幕優惠">
      </div>
      <div>
        <label for="platform">發文平台</label>
        <select id="platform">
          <option value="facebook">Facebook</option>
          <option value="instagram">Instagram</option>
          <option value="threads">Threads</option>
          <option value="x">X (Twitter)</option>
          <option value="linkedin">LinkedIn</option>
          <option value="line">LINE 官方帳號</option>
        </select>
      </div>
      <div>
        <label for="tone">語氣風格</label>
        <select id="tone">
          <option value="friendly">親切好友</option>
          <option value="pro">專業可信</option>
          <option value="funny">幽默風趣</option>
          <option value="inspire">熱血激勵</option>
          <option value="promo">促銷吸睛</option>
          <option value="warm">溫暖感性</option>
        </select>
      </div>
      <div>
        <label for="length">貼文長度</label>
        <select id="length">
          <option value="short">短（1～2 句）</option>
          <option value="medium" selected>中（適合多數平台）</option>
          <option value="long">長（完整介紹）</option>
        </select>
      </div>
      <div>
        <label for="cta">行動呼籲</label>
        <select id="cta">
          <option value="none">不加</option>
          <option value="comment" selected>邀請留言</option>
          <option value="share">邀請分享</option>
          <option value="follow">邀請追蹤</option>
          <option value="link">點擊連結</option>
          <option value="dm">私訊詢問</option>
        </select>
      </div>
      <div>
        <label for="count">產生數量</label>
        <select id="count">
          <option value="1">1 則</option>
          <option value="3" selected>3 則</option>
          <option value="5">5 則</option>
        </select>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="emoji" checked> 加入表情符號</label>
        <label><input type="checkbox" id="hashtag" checked> 加入 Hashtag</label>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="btnGen" type="button">✨ 產生貼文</button>
      <button id="btnClear" type="button">清除</button>
      <span id="msg" role="status" aria-live="polite"></span>
    </div>
  </div>

  <div id="toolbar" class="toolbar" style="display:none;">
    <strong>產生結果（可直接在框內修改）</strong>
    <button class="small" id="btnCopyAll" type="button">複製全部</button>
  </div>
  <div id="results">
    <div class="card empty">填寫上方資料後，點「產生貼文」開始吧！</div>
  </div>
</div>

<script>

        '謝謝你一路陪伴，也想讓你認識「{topic}」。'
      ],
      points: [
        '我們珍惜「{kw}」，因為它讓人感到被好好對待。',
        '「{kw}」像一束光，悄悄溫暖了日常。',
        '願每個人都能在「{kw}」裡，找到屬於自己的安心。',
        '慢慢來，「{kw}」會在對的時間陪著你。',
        '那些細膩的「{kw}」，是我們想傳遞的心意。',
        '因為有「{kw}」，平凡的一天也有了溫度。'
      ],
      close: [
        '願你今天也被溫柔以待。',
        '謝謝你看到這裡，祝你有個美好的一天。',
        '如果你也有同感，歡迎和我們說說你的故事。'
      ]
    }
  };

  var CTAS = {
    none: [],
    comment: ['你怎麼看？歡迎在留言區跟我們分享！', '留言告訴我們你的想法吧！', '想聽聽你的意見，留言見！'],
    share: ['覺得有幫助的話，歡迎分享給需要的朋友！', '分享給你身邊的人，一起看看吧！'],
    follow: ['追蹤我們，不錯過任何更新！', '按下追蹤，第一時間收到最新消息！'],
    link: ['詳情請點擊連結了解更多 👉', '更多資訊請見連結，立即前往！'],
    dm: ['有任何問題歡迎私訊我們！', '想了解更多？私訊即可詢問～']
  };

  var PLATFORM = {
    facebook:  { name: 'Facebook',  limit: 63206, tags: 3 },
    instagram: { name: 'Instagram', limit: 2200,  tags: 8 },
    threads:   { name: 'Threads',   limit: 500,   tags: 2 },
    x:         { name: 'X',         limit: 280,   tags: 2 },
    linkedin:  { name: 'LinkedIn',  limit: 3000,  tags: 4 },
    line:      { name: 'LINE',      limit: 500,   tags: 0 }
  };

  // ---------- 工具函式 ----------
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function parseKeywords(s) {
    return s.split(/[,，、;；\s]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function makeTag(word) {
    return '#' + word.replace(/[\s#]+/g, '');
  }

  var msgTimer = null;
  function showMsg(text, type) {
    var el = $('msg');
    el.textContent = text;
    el.className = type || '';
    clearTimeout(msgTimer);
    if (text) {
      msgTimer = setTimeout(function () { el.textContent = ''; el.className = ''; }, 2500);
    }
  }

  // ---------- 產生邏輯 ----------
  function buildPost(opt) {
    var T = TONES[opt.tone];
    var P = PLATFORM[opt.platform];
    var emo = function () { return pick(T.emo); };
    var fill = function (tpl) {
      return tpl.replace(/\{topic\}/g, opt.topic).replace(/\{kw\}/g, function () {
        return opt.kws.length ? pick(opt.kws) : opt.topic;
      });
    };

    var n = { short: 1, medium: 2, long: 4 }[opt.length];
    var parts = [];

    var first = fill(pick(T.open));
    if (opt.emoji) first = emo() + ' ' + first;
    parts.push(first);

    shuffle(T.points).slice(0, n).forEach(function (p) {
      var line = fill(p);
      if (opt.emoji && opt.length === 'long') line = emo() + ' ' + line;
      parts.push(line);
    });

    if (opt.length !== 'short') {
      var closing = fill(pick(T.close));
      if (opt.emoji) closing += ' ' + emo();
      parts.push(closing);
    }

    if (opt.cta !== 'none') {
      parts.push(pick(CTAS[opt.cta]));
    }

    var sep = opt.length === 'short' ? '\n' : '\n\n';
    var text = parts.join(sep);

    if (opt.hashtag && P.tags > 0) {
      var pool = opt.kws.map(makeTag);
      pool.unshift(makeTag(opt.topic));
      var seen = {};
      var tags = [];
      pool.forEach(function (t) {
        if (t.length > 1 && !seen[t]) { seen[t] = 1; tags.push(t); }
      });
      tags = tags.slice(0, P.tags);
      if (tags.length) text += '\n\n' + tags.join(' ');
    }
    return text;
  }

  // ---------- 複製 ----------
  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      showMsg(ok ? okMsg : '複製失敗，請手動選取文字複製', ok ? 'ok' : 'err');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showMsg(okMsg, 'ok');
      }, fallback);
    } else {
      fallback();
    }
  }

  // ---------- 畫面 ----------
  function updateCount(textarea, countEl, limit) {
    var len = textarea.value.length;
    countEl.textContent = len + ' / ' + limit + ' 字';
    countEl.className = 'count' + (len > limit ? ' over' : '');
  }

  function render(posts, platformKey) {
    var box = $('results');
    box.innerHTML = '';
    var P = PLATFORM[platformKey];

    posts.forEach(function (text, i) {
      var card = document.createElement('div');
      card.className = 'card result';

      var head = document.createElement('div');
      head.className = 'result-head';

      var title = document.createElement('span');
      title.className = 'result-title';
      title.textContent = '版本 ' + (i + 1) + '・' + P.name;

      var right = document.createElement('span');
      var cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.style.marginRight = '10px';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'small';
      btn.textContent = '複製';

      right.appendChild(cnt);
      right.appendChild(btn);
      head.appendChild(title);
      head.appendChild(right);

      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('data-post', '1');
      ta.addEventListener('input', function () { updateCount(ta, cnt, P.limit); });
      btn.addEventListener('click', function () {
        copyText(ta.value, '已複製版本 ' + (i + 1));
      });

      card.appendChild(head);
      card.appendChild(ta);
      box.appendChild(card);
      updateCount(ta, cnt, P.limit);
    });

    $('toolbar').style.display = 'flex';
  }

  function generate() {
    var topic = $('topic').value.trim();
    if (!topic) {
      showMsg('請先輸入貼文主題', 'err');
      $('topic').focus();
      return;
    }
    var opt = {
      topic: topic,
      kws: parseKeywords($('keywords').value),
      platform: $('platform').value,
      tone: $('tone').value,
      length: $('length').value,
      cta: $('cta').value,
      emoji: $('emoji').checked,
      hashtag: $('hashtag').checked
    };
    var count = parseInt($('count').value, 10);
    var posts = [];
    var guard = 0;
    while (posts.length < count && guard < 60) {
      var p = buildPost(opt);
      if (posts.indexOf(p) === -1) posts.push(p);
      guard++;
    }
    render(posts, opt.platform);
    showMsg('已產生 ' + posts.length + ' 則貼文', 'ok');
  }

  function clearAll() {
    $('topic').value = '';
    $('keywords').value = '';
    $('results').innerHTML = '<div class="card empty">填寫上方資料後，點「產生貼文」開始吧！</div>';
    $('toolbar').style.display = 'none';
    showMsg('已清除', 'ok');
    $('topic').focus();
  }

  function copyAll() {
    var list = document.querySelectorAll('textarea[data-post]');
    if (!list.length) { showMsg('目前沒有可複製的內容', 'err'); return; }
    var all = Array.prototype.map.call(list, function (t, i) {
      return '【版本 ' + (i + 1) + '】\n' + t.value;
    }).join('\n\n--------------------\n\n');
    copyText(all, '已複製全部版本');
  }

  $('btnGen').addEventListener('click', generate);
  $('btnClear').addEventListener('click', clearAll);
  $('btnCopyAll').addEventListener('click', copyAll);
  $('topic').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') generate();
  });
})();
</script>
</body>
</html>
